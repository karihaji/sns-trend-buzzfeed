name: Update data and deploy Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # JST 05:00 / 08:00 / 12:00 / 15:00
    - cron: "0 20,23,3,6 * * *"

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/configure-pages@v5

      - name: Fetch trends
        run: node scripts/fetch-trends.mjs

      - name: Validate generated data
        run: |
          node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('data/latest-trends.json','utf8')); const trends=data.items||[]; const local=data.context?.localEvents||[]; const sheet=(data.context?.localEventSources||[]).find((source)=>source.id==='kagoshima_event_sheet'); if(trends.length<20) throw new Error('Trend data looks too small: '+trends.length); if(local.length<10) throw new Error('Local event data looks too small: '+local.length); if(!sheet?.ok || sheet.items<1) throw new Error('Google Sheets event source is unavailable or returned no eligible events'); console.log('Validated trends='+trends.length+', localEvents='+local.length+', sheetEvents='+sheet.items+', sheetDegraded='+Boolean(sheet.degraded));"
          node scripts/validate-local-event-dates.mjs

      - name: Commit updated trend data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update SNS trend buzzfeed data"
          file_pattern: "data/*.json data/**/*.json"

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}

  deploy:
    needs: update-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.update-and-deploy.outputs.artifact_id }}
        run: |
          for attempt in {1..24}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '.artifacts[] | select(.name=="github-pages" and .expired==false) | .id' | grep -Fxq "$ARTIFACT_ID"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
