name: Update data and deploy Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # JST 08:00 / 12:00 / 15:00
    - cron: "0 23,3,6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/configure-pages@v5

      - name: Fetch trends
        run: node scripts/fetch-trends.mjs

      - name: Validate generated data
        run: |
          node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('data/latest-trends.json','utf8')); const trends=data.items||[]; const local=data.context?.localEvents||[]; if(trends.length<20) throw new Error('Trend data looks too small: '+trends.length); if(local.length<20) throw new Error('Local event data looks too small: '+local.length); console.log('Validated trends='+trends.length+', localEvents='+local.length);"

      - name: Commit updated trend data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update SNS trend buzzfeed data"
          file_pattern: "data/*.json data/**/*.json"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
